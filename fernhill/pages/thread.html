<p id="loading" class="muted">Loading…</p>
<div id="thread" hidden>
  <p><a id="t-back">← All discussions</a></p>
  <article class="card post" id="opening"></article>
  <h2 id="r-count">Replies</h2>
  <ul id="replies" class="replies"></ul>
  <form id="reply-form" class="card" novalidate>
    <div class="field"><label for="r-body">Your reply</label><textarea id="r-body" rows="4" maxlength="1000"></textarea><p class="hint" id="r-chars">0 / 1000</p></div>
    <p id="r-msg" class="msg" role="status"></p>
    <button type="submit" class="btn">Reply</button>
  </form>
</div>
